<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин електроніки</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="../script.js"></script>
</head>
<body>
    <header>
        <div class="top-bar">
            <button class="catalog-btn">Каталог товарів</button>
            <input type="text" placeholder="Знайти товар, магазин, бренд...">
            <a href="registration.html" class="icon-link">
                <i class="fas fa-user"></i>
            </a>
            <a href="cart.html" class="icon-link">
                <i class="fas fa-shopping-cart"></i>
            </a>
        </div>
    </header>
    <div class="container">
        <nav class="sidebar">
            <ul>
                <li>Велика побутова техніка</li>
                <li>Вбудована техніка</li>
                <li>Кліматична техніка</li>
                <li>Техніка для дому</li>
                <li>Персональний догляд</li>
                <li>Техніка для кухні</li>
                <li>Смарт техніка</li>
                <li>Популярно зараз</li>
            </ul>
        </nav>
        <main class="products">
            <h2>Велика побутова техніка</h2>
            <div class="product-grid">
                <div class="product"><img src="../image/washing machine.png" alt="Пральні машини"><p>Пральні машини</p></div>
                <div class="product"><img src="../image/refrigerator.png" alt="Холодильники"><p>Холодильники</p></div>
            </div>
        </main>
    </div>
</body>
</html>
